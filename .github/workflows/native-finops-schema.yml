name: Native Billing Schema Qualification
on:
  pull_request:
    paths: [sql/**, scripts/verify-native-finops-schema.py, .github/workflows/native-finops-schema.yml]
  push:
    branches: [main]
    paths: [sql/**, scripts/verify-native-finops-schema.py, .github/workflows/native-finops-schema.yml]
permissions:
  contents: read
jobs:
  postgres17:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fictional-disposable-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Qualify owned additive DDL on disposable PostgreSQL only
        run: python3 scripts/verify-native-finops-schema.py --postgres-check
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: fictional-disposable-only
