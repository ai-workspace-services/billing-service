name: Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "release/**"]
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      deployment_environment: ${{ steps.flags.outputs.deployment_environment }}
      push_image: ${{ steps.flags.outputs.push_image }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Pipeline Flags
        id: flags
        run: bash ./scripts/github-actions/resolve-workflow-inputs.sh >> "$GITHUB_OUTPUT"

  build:
    needs: prep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Vault
        uses: hashicorp/vault-action@v3
        with:
          url: https://vault.svc.plus
          role: github-actions-billing-service-${{ needs.prep.outputs.deployment_environment }}
          method: jwt
          path: github-actions

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log In To GHCR
        if: needs.prep.outputs.push_image == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Service Image Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ needs.prep.outputs.push_image == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
