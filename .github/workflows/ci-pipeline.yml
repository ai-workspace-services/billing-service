name: Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "release/**"]
    tags:
      - "v*"
      - "snapshot-*"
      - "*-rebuild-*"
      - "*-release-*"
      - "*daily-build-*"
  workflow_dispatch:
    inputs:
      deployment_environment:
        description: Deployment environment
        required: true
        default: uat
        type: choice
        options:
          - sit
          - uat
          - prod
      source_ref:
        description: Immutable source ref to build when production promotion is dispatched from main
        required: false
        default: ""
        type: string
      image_tag:
        description: Artifact Registry tag to publish for an explicit promotion
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      deployment_environment: ${{ steps.flags.outputs.deployment_environment }}
      push_image: ${{ steps.flags.outputs.push_image }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Pipeline Flags
        id: flags
        env:
          INPUT_DEPLOYMENT_ENVIRONMENT: ${{ inputs.deployment_environment }}
        run: bash ./scripts/github-actions/resolve-workflow-inputs.sh >> "$GITHUB_OUTPUT"

  build:
    needs: prep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      # 不写 path: —— 用 vault-action 默认的 jwt mount。
      #
      # 这里原本是 path: github-actions, 但 Vault 上的 JWT auth 实际挂在 jwt
      # (见 platform-ops-toolkit docs/tasks/*.sh 里的 auth/jwt/role/...),
      # 其余四个业务仓与 platform-ops / playbooks 也都用默认值。指向一个不
      # 存在的 mount 换不到任何 token, 表现为 403 permission denied ——
      # 与"role 不存在"和"绑定不匹配"完全同形, 很容易误判成权限配置问题。
      - name: Authenticate to Vault
        id: vault
        uses: hashicorp/vault-action@v4
        with:
          url: https://vault.svc.plus
          role: github-actions-billing-service-${{ needs.prep.outputs.deployment_environment }}
          jwtGithubAudience: vault
          method: jwt
          path: jwt
          secrets: |
            kv/data/CICD GHCR_USERNAME | GHCR_USERNAME ;
            kv/data/CICD GHCR_TOKEN | GHCR_TOKEN ;

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log In To GHCR
        if: needs.prep.outputs.push_image == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ steps.vault.outputs.GHCR_USERNAME }}
          password: ${{ steps.vault.outputs.GHCR_TOKEN }}

      - name: Compute Service Image Tags
        id: meta
        uses: docker/metadata-action@v5
        env:
          # Node 24 does not automatically use the runner's system CA store.
          # metadata-action performs HTTPS metadata lookups and must trust the
          # runner-installed CA used by the GitHub Actions network path.
          NODE_OPTIONS: --use-system-ca
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/') || github.ref_type == 'tag' }}
            # event=branch 不加 enable 会在 main 上产出一个 :main tag, 与
            # latest 语义重复; 真正需要分支名做 tag 的只有 release/*。
            type=ref,event=branch,enable=${{ startsWith(github.ref, 'refs/heads/release/') }}
            # 这一条原本缺失, 于是 main push 只推 :main 和 :sha-<full>, 从不推
            # :latest —— 而 gitops 的 compose/web-saas/.env.uat 引用的正是
            # ghcr.io/.../billing-service:latest, tag 对不上, Doco-CD 拉不到。
            # 契约见 platform-ops-toolkit docs/domains/IMAGE-TAG-CONTRACT.md。
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ needs.prep.outputs.push_image == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish_artifact_registry:
    name: Publish Cloud Run image to Artifact Registry
    needs: build
    # Production snapshots use immutable v* tags; UAT snapshots use
    # daily-build-* tags. Both must publish the Cloud Run image consumed by
    # platform-ops-toolkit.
    if: ${{ (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.deployment_environment == 'prod' && inputs.source_ref != '' && inputs.image_tag != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud
        id: gcp
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1004637461064/locations/global/workloadIdentityPools/github-actions/providers/github-actions-platform-ops
          service_account: gha-platform-ops-uat@xworktech.iam.gserviceaccount.com
          token_format: access_token

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: asia-northeast1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp.outputs.access_token }}

      - name: Build and push Cloud Run image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: asia-northeast1-docker.pkg.dev/xworktech/serverless/billing-service:${{ inputs.image_tag || github.ref_name }}

  release:
    name: Publish release manifest and assets
    needs: build
    if: ${{ contains(github.ref, '/tags/') && contains(github.ref, 'daily-build-') && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Prepare release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          IMAGE_REFS: ghcr.io/${{ github.repository_owner }}/billing-service:${{ github.ref_name }}
          RELEASE_BUILD_COMMAND: >-
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build
            -o "$RUNNER_TEMP/release-assets/billing-service" ./cmd/billing-service
            && zip -j "$RUNNER_TEMP/release-assets/billing-service-${{ github.ref_name }}.zip"
            "$RUNNER_TEMP/release-assets/billing-service"
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/publish-release-artifacts.sh
