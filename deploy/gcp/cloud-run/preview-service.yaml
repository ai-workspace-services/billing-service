apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: preview-billing-svc-plus
  labels:
    cloud.googleapis.com/location: asia-northeast1
  annotations:
    run.googleapis.com/launch-stage: BETA
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/startup-cpu-boost: 'true'
        autoscaling.knative.dev/maxScale: '1'
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: 266500572462-compute@developer.gserviceaccount.com
      containers:
      - name: billing-api
        image: asia-northeast1-docker.pkg.dev/xzerolab-480008/cloud-run-source-deploy/billing-service/preview-billing-svc-plus:latest
        ports:
        - name: http1
          containerPort: 8080
        env:
        - name: BILLING_INGEST_MODE
          value: push
        - name: IMAGE
          value: asia-northeast1-docker.pkg.dev/xzerolab-480008/cloud-run-source-deploy/billing-service/preview-billing-svc-plus:latest
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: billing-database-url
              key: latest
        - name: INTERNAL_SERVICE_TOKEN
          valueFrom:
            secretKeyRef:
              name: internal-service-token
              key: latest
        resources:
          limits:
            cpu: 1000m
            memory: 512Mi
        startupProbe:
          timeoutSeconds: 10
          periodSeconds: 10
          failureThreshold: 30
          tcpSocket:
            port: 8080
